<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathQuest — Талдықорған & Инженерлік Экожүйе</title>
  <link rel="stylesheet" href="css/style.css?v=4.0" />
  <link rel="stylesheet" href="css/game.css?v=4.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <!-- KaTeX — математикалық өрнектерді әдемі көрсетеді -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Жұлдызды фон -->
  <div class="stars" id="stars"></div>

  <!-- Ойын рендерленетін аймақ -->
  <div id="app"></div>

  <script src="js/stars.js?v=4.0"></script>
  <script defer src="js/bridge.js?v=4.0"></script>
  <script defer src="js/game.js?v=4.0"></script>
  <script defer src="js/features.js?v=4.0"></script>
  <script>
    // Қосымша тексеру: егер defer скрипті кешіксе, толық жүктелгенде шақыру
    window.addEventListener('load', () => {
      if (typeof App !== 'undefined' && !document.querySelector('.game-wrapper')) {
        App.init();
      }
    });
  </script>
</body>
</html>
